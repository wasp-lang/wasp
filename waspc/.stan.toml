# Configuration for stan, the Haskell static analyser. Run it with `./run stan`.

# STAN-0212 flags `undefined`, which tests legitimately use as a placeholder for values
# the code under test never forces. Allow it in our test suites.
[[check]]
  type = "Exclude"
  id = "STAN-0212"
  directory = "tests"

[[check]]
  type = "Exclude"
  id = "STAN-0212"
  directory = "cli/tests"

[[check]]
  type = "Exclude"
  id = "STAN-0212"
  directory = "e2e-tests"

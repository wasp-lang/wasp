<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="668" viewBox="0 0 1100 668" role="img" aria-labelledby="t d">
  <title id="t">Designing an agent-friendly web app</title>
  <desc id="d">Your web app sits in the middle with one set of operations (createLink, listLinks, deleteLink). Four spokes go out from it: a dashboard for people, an MCP server with tools like create_link, a REST API with endpoints like POST /api/v1/links, and a CLI run from a terminal. All four call the same operations.</desc>
  <style>
    svg {
      --bg: #ffffff; --band: #f3f5f8; --box: #f8fafb; --ink: #15202b; --muted: #5a6774; --line: #cbd3db; --req: #2f5bd8;
      --term: #15202b; --term-ink: #e4ebf1; --ok: #23863a;
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: var(--ink); }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .title { font-size: 30px; font-weight: 700; }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1; }
    .hub { stroke: var(--req); stroke-width: 2.5; }
    .t { font-size: 24px; font-weight: 600; }
    .s { font-size: 18px; fill: var(--muted); }
    .row { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
    .row-t { font-size: 16px; }
    .verb { font-weight: 700; fill: var(--req); }
    .spoke { fill: none; stroke: var(--req); stroke-width: 3; stroke-linecap: round; }
    .end { fill: var(--req); }
    .chat { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
    .chat-dot { fill: var(--line); }
    .chat-rule { stroke: var(--line); stroke-width: 1; }
    .url { fill: var(--box); stroke: var(--line); stroke-width: 1; }
    .bar-bot { fill: var(--muted); opacity: .45; }
    .bar-chart { fill: var(--req); opacity: .8; }
    .mcp-mark { fill: none; stroke: var(--ink); stroke-width: 12; stroke-linecap: round; }
    .term { fill: var(--term); }
    .term-dot { fill: var(--term-ink); opacity: .3; }
    .term-t { font-size: 15px; fill: var(--term-ink); }
    .term-bar { fill: var(--term-ink); opacity: .3; }
    .prompt { fill: var(--ok); font-weight: 700; }
    .cursor { fill: var(--term-ink); opacity: .7; }
  </style>

  <rect class="bg" width="1100" height="668" rx="14"/>
  <rect class="band" x="8" y="8" width="1084" height="652" rx="10"/>
  <text class="title" x="550.0" y="66" text-anchor="middle">Designing an Agent-friendly web app</text>
  <path class="spoke" d="M360 222.0 C380.0 222.0 380.0 328 400 328"/>
  <circle class="end" cx="360" cy="222.0" r="5"/>
  <circle class="end" cx="400" cy="328" r="5"/>
  <path class="spoke" d="M360 530.0 C380.0 530.0 380.0 448 400 448"/>
  <circle class="end" cx="360" cy="530.0" r="5"/>
  <circle class="end" cx="400" cy="448" r="5"/>
  <path class="spoke" d="M740 222.0 C720.0 222.0 720.0 328 700 328"/>
  <circle class="end" cx="740" cy="222.0" r="5"/>
  <circle class="end" cx="700" cy="328" r="5"/>
  <path class="spoke" d="M740 530.0 C720.0 530.0 720.0 448 700 448"/>
  <circle class="end" cx="740" cy="530.0" r="5"/>
  <circle class="end" cx="700" cy="448" r="5"/>
  <rect class="box hub" x="400" y="268" width="300" height="240" rx="12"/>
  <text class="t" x="422" y="310">Your web app</text>
  <text class="s" x="422" y="338">one set of operations</text>
  <rect class="row" x="422" y="362" width="256" height="36" rx="8"/>
  <text class="row-t mono" x="440" y="386">createLink()</text>
  <rect class="row" x="422" y="408" width="256" height="36" rx="8"/>
  <text class="row-t mono" x="440" y="432">listLinks()</text>
  <rect class="row" x="422" y="454" width="256" height="36" rx="8"/>
  <text class="row-t mono" x="440" y="478">deleteLink()</text>
  <rect class="box" x="40" y="112" width="320" height="220" rx="12"/>
  <text class="t" x="62" y="154">Dashboard</text>

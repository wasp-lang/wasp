  <rect class="bar-bot" x="74" y="230" width="26" height="6" rx="3"/>
  <rect class="bar-bot" x="74" y="248" width="36" height="6" rx="3"/>
  <rect class="bar-bot" x="74" y="266" width="26" height="6" rx="3"/>
  <rect class="bar-chart" x="140" y="270" width="16" height="26" rx="3"/>
  <rect class="bar-chart" x="166" y="252" width="16" height="44" rx="3"/>
  <rect class="bar-chart" x="192" y="262" width="16" height="34" rx="3"/>
  <rect class="bar-chart" x="218" y="234" width="16" height="62" rx="3"/>
  <rect class="bar-chart" x="244" y="246" width="16" height="50" rx="3"/>
  <rect class="bar-chart" x="270" y="224" width="16" height="72" rx="3"/>
  <line class="chat-rule" x1="134" y1="296" x2="326" y2="296"/>
  <rect class="box" x="740" y="112" width="320" height="220" rx="12"/>
  <g transform="translate(756,128) scale(0.2)"><path class="mcp-mark" d="M25 97.8528L92.8822 29.9706C102.255 20.598 117.451 20.598 126.823 29.9706V29.9706C136.196 39.3431 136.196 54.5391 126.823 63.9117L75.5581 115.177"/><path class="mcp-mark" d="M76.2652 114.47L126.823 63.9117C136.196 54.5391 151.392 54.5391 160.765 63.9117L161.118 64.2652C170.491 73.6378 170.491 88.8338 161.118 98.2063L99.7248 159.6C96.6006 162.724 96.6006 167.789 99.7248 170.913L112.331 183.52"/><path class="mcp-mark" d="M109.853 46.9411L59.6482 97.1457C50.2756 106.518 50.2756 121.714 59.6482 131.087V131.087C69.0208 140.459 84.2167 140.459 93.5893 131.087L143.794 80.8822"/></g>
  <text class="t" x="800" y="154">MCP</text>
  <rect class="row" x="762" y="176" width="276" height="36" rx="8"/>
  <text class="row-t mono" x="780" y="200">create_link</text>
  <rect class="row" x="762" y="222" width="276" height="36" rx="8"/>
  <text class="row-t mono" x="780" y="246">list_links</text>
  <rect class="row" x="762" y="268" width="276" height="36" rx="8"/>
  <text class="row-t mono" x="780" y="292">delete_link</text>
  <rect class="box" x="40" y="420" width="320" height="220" rx="12"/>
  <text class="t" x="62" y="462">API</text>
  <rect class="row" x="62" y="484" width="276" height="36" rx="8"/>
  <text class="row-t mono" x="76" y="508"><tspan class="verb">POST</tspan> /api/v1/links</text>
  <rect class="row" x="62" y="530" width="276" height="36" rx="8"/>
  <text class="row-t mono" x="76" y="554"><tspan class="verb">GET</tspan> /api/v1/links</text>
  <rect class="row" x="62" y="576" width="276" height="36" rx="8"/>
  <text class="row-t mono" x="76" y="600"><tspan class="verb">DELETE</tspan> /api/v1/links/{id}</text>
  <rect class="box" x="740" y="420" width="320" height="220" rx="12"/>
  <text class="t" x="762" y="462">CLI</text>
  <rect class="term" x="762" y="484" width="276" height="134" rx="8"/>
  <circle class="term-dot" cx="775" cy="496" r="3"/>
  <circle class="term-dot" cx="785" cy="496" r="3"/>
  <circle class="term-dot" cx="795" cy="496" r="3"/>
  <text class="term-t mono" x="776" y="530"><tspan class="prompt">$</tspan> linkly links list</text>
  <rect class="term-bar" x="776" y="546" width="180" height="6" rx="3"/>
  <rect class="term-bar" x="776" y="562" width="150" height="6" rx="3"/>
  <rect class="term-bar" x="776" y="578" width="196" height="6" rx="3"/>
  <text class="term-t mono" x="776" y="608"><tspan class="prompt">$</tspan> <tspan class="cursor">▍</tspan></text>
</svg>

# Common commands used during building / developing `waspc`.
# Run `mise tasks` to list them and `mise run <task>` to run one from anywhere in the repo.

# Building

[build]
description = "Builds the Haskell project + all sub-projects (i.e. TS packages). Run with the `BUILD_STATIC=1` env to build statically."
run = [{ task = "build:packages" }, { task = "build:libs" }, { task = "build:hs" }]

["build:hs"]
description = "Builds the Haskell project only. Run with the `BUILD_STATIC=1` env to build statically."
dir = "waspc"
shell = "bash -c"
run = "cabal build all ${BUILD_STATIC:+--enable-executable-static}"

[install]
description = "Installs the wasp executable as 'wasp-cli' globally on the machine."
dir = "waspc"
run = [{ task = "build:packages" }, { task = "build:libs" }, "cabal install --overwrite-policy=always"]

# Wasp CLI

# `raw_args` forwards every argument, including `--help`, to the wrapped tool.
[wasp-cli]
description = "Runs the dev version of wasp executable in the current directory while forwarding arguments. Builds the project (hs) first if needed."
dir = "{{cwd}}"
raw_args = true
run = "{{vars.wasp_cli_dev}}"

# Testing

[test]
description = "Executes all tests (waspc + Wasp CLI + examples + starters). Builds the project first if needed."
dir = "waspc"
env.WASP_CLI_CMD = "{{vars.wasp_cli_dev}}"
run = ["cabal test", { task = "test:starters" }, { task = "test:examples" }, { task = "test:libs" }, { task = "test:packages" }]

["test:waspc"]
description = "Executes all waspc tests (unit + e2e). Builds the project first if needed."
run = [{ task = "test:waspc:unit" }, { task = "test:waspc:e2e" }]

["test:waspc:unit"]
description = "Executes only waspc unit tests. Builds the project first if needed. If pattern is provided, it will run only tests whose description/name matches the pattern. Check https://github.com/UnkindPartition/tasty#patterns to learn more about valid patterns."
usage = 'arg "[pattern]"'
dir = "waspc"
shell = "bash -c"
run = 'cabal test waspc-tests --test-option=--hide-successes --test-option=--pattern="$usage_pattern"'

["test:waspc:e2e"]
description = "Executes only cli e2e tests. Builds the project first if needed. If pattern is provided, it will run only tests whose description/name matches the pattern. Check https://github.com/UnkindPartition/tasty#patterns to learn more about valid patterns."
usage = 'arg "[pattern]"'
dir = "waspc"
shell = "bash -c"
env.WASP_CLI_CMD = "{{vars.wasp_cli_dev}}"
run = 'cabal test waspc-e2e-tests --test-option=--hide-successes --test-option=--pattern="$usage_pattern"'

["test:waspc:e2e:accept-all"]
description = "Accepts any diffs in the generated app in Wasp CLI snapshot tests. Does so by deleting the current golden output and re-running snapshot tests to produce the new golden output."
dir = "waspc"
shell = "bash -c"
run = ["rm -rf e2e-tests/test-outputs/snapshots/*-golden", { task = "test:waspc:e2e" }]

["test:cli"]
description = "Executes only cli tests. Builds the project first if needed."
dir = "waspc"
run = "cabal test wasp-cli-tests --test-option=--hide-successes"

# Wasp App Runner
# Utility used for running e2e tests in Wasp apps, we use it for testing
# e.g. examples and starters.

[build-wasp-app-runner]
hide = true
run = "pnpm --filter @wasp/wasp-app-runner run build"

["test:kitchen-sink"]
description = "Executes only kitchen-sink e2e tests. Installs deps first if needed."
depends = ["build-wasp-app-runner"]
dir = "examples/kitchen-sink"
env.WASP_CLI_CMD = "{{vars.wasp_cli_dev}}"
env.WASP_APP_RUNNER_CLI_CMD = "{{vars.wasp_app_runner_cli}}"
run = ["{{vars.wasp_cli_dev}} install", "npm run test"]

["test:starters"]
description = "Executes only starter templates e2e tests. Installs deps first if needed."
depends = ["build-wasp-app-runner"]
dir = "waspc/starters-e2e-tests"
env.WASP_CLI_CMD = "{{vars.wasp_cli_dev}}"
env.WASP_APP_RUNNER_CLI_CMD = "{{vars.wasp_app_runner_cli}}"
run = "pnpm run test:dev"

# Utility

[ghcid]
description = "Runs ghcid, which watches source file changes and reports errors. Does not watch tests."
dir = "waspc"
run = "ghcid --command=cabal repl"

[ghcid-test]
description = "Runs ghcid on both source and tests."
dir = "waspc"
shell = "bash -c"
# --color always is needed for Tasty to turn on the coloring.
run = "ghcid '-T=:main --color always' --command=cabal repl tests/TastyDiscoverDriver.hs"

[code-check]
description = "Checks code by running it through formatter, linter and static analysis."
depends = ["check:*", "hlint", "stan"]

[stan]
description = "Runs static code analysis on the code, generating stan.html. Builds the project first if needed."
dir = "waspc"
raw_args = true
run = ["cabal build all --enable-tests --enable-benchmarks", "stan report"]

[hlint]
description = "Runs linter on the codebase."
dir = "waspc"
raw_args = true
run = "hlint ."

[format]
description = "Runs all code formatters (ormolu, cabal-gild, prettier) and formats the code in place."
depends = ["format:*"]

[check]
description = "Runs all code formatters in check mode and reports if code is correctly formatted or not."
depends = ["check:*"]

["format:ormolu"]
description = "Runs the Haskell code formatter and formats the code in place."
dir = "waspc"
shell = "bash -c"
run = "git ls-files -z '*.hs' '*.hs-boot' | xargs -0 ormolu --color always --check-idempotence --mode inplace"

["check:ormolu"]
description = "Runs the Haskell code formatter and reports if code is correctly formatted or not."
dir = "waspc"
shell = "bash -c"
run = "git ls-files -z '*.hs' '*.hs-boot' | xargs -0 ormolu --color always --check-idempotence --mode check"

["format:cabal"]
description = "Runs the .cabal file formatter and formats the code in place."
dir = "waspc"
shell = "bash -c"
run = "git ls-files -z '*.cabal' | xargs -0 cabal-gild --mode format"

["check:cabal"]
description = "Runs the .cabal file formatter and reports if code is correctly formatted or not."
dir = "waspc"
shell = "bash -c"
run = "git ls-files -z '*.cabal' | xargs -0 cabal-gild --mode check"

["format:prettier"]
description = "Runs the repo-wide code formatter and formats the code in place."
run = "pnpm run format:prettier"

["check:prettier"]
description = "Runs the repo-wide code formatter and reports if code is correctly formatted or not."
run = "pnpm run check:prettier"

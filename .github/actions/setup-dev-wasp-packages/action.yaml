name: Set up dev Wasp npm packages
description: |
  Sets up the job to use the unreleased Wasp npm packages from this repo. Packs
  @wasp/wasp and the packages it depends on into waspc/.dev-packages (see
  tasks/build/dev-packages.ts), points the dev @wasp/cli at the wasp-cli that
  install-wasp-cli-artifact installed, and sets WASP_DEV_PACKAGES_DIR so
  `wasp new` uses the packages. Run it after setup-tools and
  install-wasp-cli-artifact.

runs:
  using: composite
  steps:
    - name: Pack the dev Wasp npm packages and point `wasp new` at them
      shell: bash
      working-directory: waspc
      env:
        WASP_DEV_DATA_DIR: ${{ env.waspc_datadir }}
      run:
        # zizmor: ignore[github-env]
        |
        WASP_DEV_CLI_BIN="$(command -v wasp-cli)" mise run build:dev-packages
        echo "WASP_DEV_PACKAGES_DIR=$GITHUB_WORKSPACE/waspc/.dev-packages" >> "$GITHUB_ENV"

name: Wait for deployed app
description: Wait for the server health endpoint and client URL to respond successfully.

inputs:
  server-url:
    description: Deployed server URL
    required: true
  client-url:
    description: Deployed client URL
    required: true

runs:
  using: composite
  steps:
    - name: Check server and client URLs
      shell: bash
      env:
        SERVER_URL: ${{ inputs.server-url }}
        CLIENT_URL: ${{ inputs.client-url }}
      run: |
        curl --fail --silent --show-error --retry 29 --retry-all-errors --retry-delay 10 --max-time 10 --output /dev/null "${SERVER_URL%/}/up"
        curl --fail --silent --show-error --retry 29 --retry-all-errors --retry-delay 10 --max-time 10 --output /dev/null "${CLIENT_URL%/}/"

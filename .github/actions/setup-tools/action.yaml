name: Setup dev tools
description: >
  This action sets up our Mise-defined dev tools and environment for use in
  actions. It also sets up caches for package manager dependencies.

inputs:
  haskell:
    description: Whether to install Haskell tools (ghcup, cabal, etc.) or not.
    required: false
    default: "false"

runs:
  using: composite

  steps:
    - name: Install Mise and cache pre-dependencies
      if: ${{ runner.os == 'Linux' }}
      shell: sh
      # Bare container images lack some tools that the steps below need. They
      # must be installed before Mise, because it restores its cache first.
      # - `curl` is needed to download Mise.
      # - Alpine's default `tar` and `bash` (which are just BusyBox) don't
      #   support GitHub's caches:
      #   https://github.com/actions/toolkit/issues/634
      # - We install `zstd` so caches can use a better, faster compression
      #   method.
      run: |
        tools="curl tar bash zstd"

        missing=false
        for package in $tools; do
          command -v "$package" >/dev/null || missing=true
        done

        if [ "$missing" = true ]; then
          if [ -f /etc/alpine-release ]; then
            apk add --no-cache $tools
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y $tools
          fi
        fi

    - name: Select Mise environment
      shell: bash
      env:
        # Loads `.config/mise/config.$MISE_ENV.toml` on top of `mise.toml`,
        # which disables dev-only tools that are not used in CI.
        MISE_ENV: ${{ inputs.haskell == 'true' && 'ci' || 'ci-no-haskell' }}
      run:
        # We control the value passed here completely.
        # zizmor: ignore[github-env]
        echo "MISE_ENV=$MISE_ENV" >> "$GITHUB_ENV"

    - name: Select cache policy
      id: cache-policy
      shell: bash
      env:
        # We only save caches from long-lived branches. PR runs can still
        # restore them, but if they saved their own copies (which can't be
        # shared with other PRs), they would push the repo over its cache
        # storage limit and get the long-lived branches' caches evicted.
        SAVE: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release' }}
      run: echo "save=$SAVE" >> "$GITHUB_OUTPUT"

    - name: Install Mise
      uses: jdx/mise-action@v5
      with:
        version: 2026.9.15
        bootstrap: true
        bootstrap_args: --update --yes
        cache_save: ${{ steps.cache-policy.outputs.save }}

    # `actions/cache` always saves in its post step, so to only restore we have
    # to use `actions/cache/restore` instead. For each cache below, we pick one
    # or the other with `if`.

    - name: Probe npm cache
      id: probe-npm
      shell: bash
      env:
        KEY: >-
          ${{ format('npm-v1-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('package-lock.json')) }}
        RESTORE_KEY: >-
          ${{ format('npm-v1-{0}-{1}-', runner.os, runner.arch) }}
      run: |
        echo "NPM_CACHE=$(npm config get cache)" >> "$GITHUB_OUTPUT"
        echo "KEY=$KEY" >> "$GITHUB_OUTPUT"
        echo "RESTORE_KEY=$RESTORE_KEY" >> "$GITHUB_OUTPUT"

    - name: Cache npm dependencies
      if: ${{ steps.cache-policy.outputs.save == 'true' }}
      uses: actions/cache@v5
      with:
        path: ${{ steps.probe-npm.outputs.NPM_CACHE }}
        key: ${{ steps.probe-npm.outputs.KEY }}
        restore-keys: ${{ steps.probe-npm.outputs.RESTORE_KEY }}

    - name: Restore npm dependencies
      if: ${{ steps.cache-policy.outputs.save != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.probe-npm.outputs.NPM_CACHE }}
        key: ${{ steps.probe-npm.outputs.KEY }}
        restore-keys: ${{ steps.probe-npm.outputs.RESTORE_KEY }}

    # We can't have the following steps in a different action because of a
    # GitHub Actions bug with how caches interact with nested composite actions:
    # https://github.com/actions/runner/issues/2030

    ##### Caching Cabal index #####
    # The Cabal index is the biggest part of our Cabal cache, and it can be
    # cached once between all OS and shared, so we cache it separately from the
    # store. `actions/cache` only shares entries if the `path` is constant, so
    # we move it inside our workspace.
    - name: Move Cabal index into the workspace
      if: ${{ inputs.haskell == 'true' }}
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p .cabal-index
        echo '*' > .cabal-index/.gitignore
        cabal user-config update -a "remote-repo-cache: $GITHUB_WORKSPACE/.cabal-index"

    - name: Probe Hackage index cache
      if: ${{ inputs.haskell == 'true' }}
      id: probe-hackage-index
      shell: bash
      env:
        # The `index-state` in `cabal.project` decides which part of the index
        # we need. When it changes, we fall back to an older index, and `cabal
        # update` just downloads the missing part.
        KEY: cabal-index-v1-${{ hashFiles('waspc/cabal.project') }}
      run: echo "KEY=$KEY" >> "$GITHUB_OUTPUT"

    - name: Cache Hackage index
      if: ${{ inputs.haskell == 'true' && steps.cache-policy.outputs.save == 'true' }}
      id: cache-hackage-index
      uses: actions/cache@v5
      with:
        # We skip the downloaded package sources, as they're only needed when
        # building dependencies, which are already cached in the Cabal store.
        path: |
          .cabal-index/hackage.haskell.org/01-index.*
          .cabal-index/hackage.haskell.org/*.json
        key: ${{ steps.probe-hackage-index.outputs.KEY }}
        restore-keys: cabal-index-v1-
        enableCrossOsArchive: true

    - name: Restore Hackage index
      if: ${{ inputs.haskell == 'true' && steps.cache-policy.outputs.save != 'true' }}
      id: restore-hackage-index
      uses: actions/cache/restore@v5
      with:
        path: |
          .cabal-index/hackage.haskell.org/01-index.*
          .cabal-index/hackage.haskell.org/*.json
        key: ${{ steps.probe-hackage-index.outputs.KEY }}
        restore-keys: cabal-index-v1-
        enableCrossOsArchive: true

    - name: Update Cabal package index
      if: >-
        ${{
          inputs.haskell == 'true'
          && steps.cache-hackage-index.outputs.cache-hit != 'true'
          && steps.restore-hackage-index.outputs.cache-hit != 'true'
        }}
      shell: bash
      working-directory: waspc
      run: cabal update

    ##### Caching Cabal store #####
    - name: Probe GHC and Cabal
      if: ${{ inputs.haskell == 'true' }}
      id: probe-ghc-cabal
      shell: bash
      run: |
        set -euxo pipefail
        echo "GHC_VERSION=$(ghc --numeric-version)" >> $GITHUB_OUTPUT
        echo "CABAL_STORE=$(cabal path -v0 --store-dir)" >> $GITHUB_OUTPUT

    - name: Probe system libc
      id: probe-libc
      if: ${{ inputs.haskell == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euxo pipefail
        # Detect the libc so the Cabal cache key keeps glibc and musl builds
        # apart.
        ldd_version="$(ldd --version 2>&1 || true)"
        case "$ldd_version" in
          *musl*) libc=musl ;;
          *) libc=default ;;
        esac
        echo "LIBC=$libc" >> "$GITHUB_OUTPUT"

    - name: Probe Cabal store cache
      if: ${{ inputs.haskell == 'true' }}
      id: probe-cabal-store
      shell: bash
      env:
        KEY:
          # The `v3` prefix is used so we don't restore older entries, which
          # also had the Hackage index inside.
          >-
          ${{
            format(
              'cabal-v3-{0}-{1}-{2}-{3}-{4}-{5}',
              'waspc',
              runner.os,
              runner.arch,
              steps.probe-libc.outputs.LIBC || 'unknown',
              steps.probe-ghc-cabal.outputs.GHC_VERSION,
              hashFiles(
                'waspc/*.cabal',
                'waspc/*.project',
                'waspc/*.project.freeze'
              )
            )
          }}
        RESTORE_KEY: >-
          ${{
            format(
              'cabal-v3-{0}-{1}-{2}-{3}-{4}-',
              'waspc',
              runner.os,
              runner.arch,
              steps.probe-libc.outputs.LIBC || 'unknown',
              steps.probe-ghc-cabal.outputs.GHC_VERSION
            )
          }}
      run: |
        echo "KEY=$KEY" >> "$GITHUB_OUTPUT"
        echo "RESTORE_KEY=$RESTORE_KEY" >> "$GITHUB_OUTPUT"

    # Based on the official recipe for Cabal caching:
    # https://github.com/actions/cache/blob/v5.0.4/examples.md#haskell---cabal
    - name: Cache Cabal store
      if: ${{ inputs.haskell == 'true' && steps.cache-policy.outputs.save == 'true' }}
      uses: actions/cache@v5
      with:
        # While commonly cached, we've decided not to cache:
        #
        # - `./dist-newstyle`: Our internal code builds quite fast, and changes
        #   often enough that a cache would need to be invalidated on every run,
        #   and make our cache much bigger.
        path: ${{ steps.probe-ghc-cabal.outputs.CABAL_STORE }}
        key: ${{ steps.probe-cabal-store.outputs.KEY }}
        restore-keys: ${{ steps.probe-cabal-store.outputs.RESTORE_KEY }}

    - name: Restore Cabal store
      if: ${{ inputs.haskell == 'true' && steps.cache-policy.outputs.save != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.probe-ghc-cabal.outputs.CABAL_STORE }}
        key: ${{ steps.probe-cabal-store.outputs.KEY }}
        restore-keys: ${{ steps.probe-cabal-store.outputs.RESTORE_KEY }}

name: Build dev Wasp npm packages
description: |
  Packs the unreleased @wasp/wasp, @wasp/cli and @wasp/spec from this repo into
  waspc/.dev-packages (see waspc/tools/dev-packages), and sets
  WASP_DEV_PACKAGES_DIR so `wasp new` uses them. Run it after setup-tools and
  install-wasp-cli-artifact. The dev @wasp/cli runs that installed wasp-cli.

runs:
  using: composite
  steps:
    - name: Build dev Wasp npm packages
      shell: bash
      working-directory: waspc
      env:
        WASP_DEV_DATA_DIR: ${{ env.waspc_datadir }}
      run:
        # zizmor: ignore[github-env]
        |
        WASP_DEV_CLI_BIN="$(command -v wasp-cli)" ./run build:dev-packages
        echo "WASP_DEV_PACKAGES_DIR=$GITHUB_WORKSPACE/waspc/.dev-packages" >> "$GITHUB_ENV"

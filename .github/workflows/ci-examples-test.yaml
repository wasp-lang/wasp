name: "Test - Example apps"

on:
  workflow_call:

env:
  WASP_TELEMETRY_DISABLE: 1
  # All Playwright configs only use Chromium, and CI runs headless.
  WASP_PLAYWRIGHT_INSTALL_FLAGS: "--with-deps --only-shell chromium"

jobs:
  test-example-apps:
    name: Test Example Apps
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example-path:
          - tutorials/TodoApp
          - tutorials/TodoAppTs
          - waspello
          - waspleau
          - websockets-realtime-voting
          - ask-the-documents
          - kitchen-sink

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-tools

      - uses: $/.github/actions/install-wasp-cli-artifact

      - name: Provide GitHub token to waspleau example app
        if: matrix.example-path == 'waspleau'
        working-directory: examples/${{ matrix.example-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ ! -f .env.server.example ] || cp .env.server.example .env.server
          echo "GITHUB_TOKEN=$GITHUB_TOKEN" >> .env.server

      - name: Install wasp-app-runner dependencies
        run: pnpm install --filter @wasp/wasp-app-runner

      - name: Run tests for example app "${{ matrix.example-path }}"
        env:
          EXAMPLE_PATH: ${{ matrix.example-path }}
          WASP_CLI_CMD: wasp-cli
        run: |
          for wasp_run_mode in dev build; do
            WASP_RUN_MODE=$wasp_run_mode mise run test:examples "$EXAMPLE_PATH"
          done

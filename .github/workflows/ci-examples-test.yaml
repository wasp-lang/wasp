name: "Test - E2E Example apps"

on:
  workflow_call:

env:
  WASP_TELEMETRY_DISABLE: 1

jobs:
  test-example-apps:
    name: Test Example Apps
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        example:
          - tutorials/TodoApp
          - tutorials/TodoAppTs
          - waspello
          - waspleau
          - websockets-realtime-voting
          - ask-the-documents
          - kitchen-sink
          # Runtime coverage for the auth provider contract: the credential
          # exchange, provider-attributed sessions, and logout revocation.
          - auth-providers/custom-password
          # The externalized-wasp-auth POC: package-provider flows, app-level
          # hook veto, and the OAuth redirect leg.
          - auth-providers/wasp-auth-lib

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools

      - uses: ./.github/actions/install-wasp-cli-artifact

      - name: Build the local auth adapter package
        if: matrix.example == 'auth-providers/wasp-auth-lib'
        working-directory: examples/auth-providers/packages/auth
        run: npm install && npm run build

      - name: Install app dependencies
        working-directory: examples/${{ matrix.example }}
        run: wasp-cli install

      # We must compile the project to generate the Wasp libs before installing deps
      - name: Compile project and install deps for ${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        run: wasp-cli compile

      - name: Run client tests for ${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        run: wasp-cli test client run --passWithNoTests

      - name: Setup project environment for ${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        run: |
          if [ -f ".env.server.example" ]; then
            cp .env.server.example .env.server
          fi

      - name: Extract Database Provider
        id: extract-db-provider
        working-directory: examples/${{ matrix.example }}
        run: |
          DATABASE_PROVIDER=$($GITHUB_WORKSPACE/scripts/get-wasp-database-provider.sh wasp-cli)
          echo "provider=$DATABASE_PROVIDER" >> $GITHUB_OUTPUT

      - name: Prepare wasp-app-runner
        working-directory: wasp-app-runner
        run: npm install && npm run build

      - name: Run DEV e2e tests for ${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        env:
          WASP_APP_RUNNER_CLI_CMD: ${{ github.workspace }}/wasp-app-runner/bin/index.js
          WASP_CLI_CMD: wasp-cli
          WASP_RUN_MODE: dev
        run: npm run test

      - name: Run BUILD e2e tests for ${{ matrix.example }}
        # Skip BUILD tests for SQLite projects, as it is not supported by Wasp
        if: steps.extract-db-provider.outputs.provider != 'sqlite'
        working-directory: examples/${{ matrix.example }}
        env:
          WASP_APP_RUNNER_CLI_CMD: ${{ github.workspace }}/wasp-app-runner/bin/index.js
          WASP_CLI_CMD: wasp-cli
          WASP_RUN_MODE: build
        run: npm run test

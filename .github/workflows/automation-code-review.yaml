name: "Automation - Code review"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review pull request
    if: >-
      ${{
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.review.outputs.final-message }}
    steps:
      - name: Checkout pull request merge
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Fetch exact review range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_SHA" \
            "$PR_HEAD_SHA"

      - name: Generate Codex inputs
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        working-directory: .github/code-review
        run: |
          npm ci --ignore-scripts
          npm run check
          npm run load-review-context
          npm run generate-inputs

      - name: Run code review
        id: review
        uses: openai/codex-action@v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.145.0
          model: gpt-5.6-sol
          effort: high
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          output-schema-file: .github/code-review/output-schema.json
          prompt-file: .github/code-review/review-prompt.md

  publish:
    name: Publish review
    if: ${{ needs.review.outputs.review != '' }}
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-publisher
          persist-credentials: false

      # The trusted publisher is unavailable only while this workflow is first
      # being introduced, before these files exist on the base branch.
      - name: Check trusted publisher availability
        id: trusted-publisher
        run: |
          if [[ -f trusted-publisher/.github/code-review/review-publisher.ts ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install publisher dependencies
        if: ${{ steps.trusted-publisher.outputs.available == 'true' }}
        working-directory: trusted-publisher/.github/code-review
        run: npm ci --ignore-scripts

      - name: Publish review lifecycle
        if: ${{ steps.trusted-publisher.outputs.available == 'true' }}
        env:
          CODEX_REVIEW_JSON: ${{ needs.review.outputs.review }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: npm --prefix trusted-publisher/.github/code-review run publish-review

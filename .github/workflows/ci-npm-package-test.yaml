name: "Test - Wasp npm packages"

on:
  workflow_call:
    inputs:
      data-files-list:
        description: "Expected data files list with per-file SHA-256 hashes."
        required: true
        type: string
      exclude-runner:
        description: >
          Runner to skip testing on (e.g. `macos-15-intel`). If empty, all
          tests run.
        required: false
        type: string
        default: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - # Regular Linux with Glibc
            os: ubuntu-24.04

          - # Linux with Musl
            os: ubuntu-24.04
            container: alpine:3.23

          - # Linux ARM64 with Glibc
            os: ubuntu-24.04-arm

          - # Apple Silicon
            os: macos-latest

          - # Apple Intel
            os: macos-15-intel

        exclude:
          - runner:
              os: ${{ inputs.exclude-runner }}

    name: "${{ matrix.runner.container || matrix.runner.os }}"

    runs-on: ${{ matrix.runner.os }}
    container: ${{ matrix.runner.container }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-tools

      - name: Install Wasp npm packages from pkg.pr.new
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run:
          # We are testing the published packages themselves, so there is no lockfile.
          # zizmor: ignore[adhoc-packages]
          |
          set -eux

          # Create a test project to install into
          mkdir install-test && cd install-test
          echo '{}' > package.json

          # Install `@wasp/wasp`, the way a Wasp project depends on Wasp.
          # pkg.pr.new points its dependencies at the other packages of this
          # commit, so it brings all of them: `@wasp/cli` with the platform
          # sub-package for this runner, `@wasp/spec`, `@wasp/deploy` and
          # `@wasp/studio`. npm also installs its peer dependencies.
          # The URL is repository-qualified because pkg.pr.new's short form
          # only works for packages that are already published to npm.
          npm install "https://pkg.pr.new/wasp-lang/wasp/@wasp/wasp@$COMMIT_SHA"

      - name: Run Wasp CLI
        run: |
          set -eux
          cd install-test

          # Test that the Wasp CLI can find and run the binary.
          NODE_DEBUG=wasp-bin-wrapper npx wasp version

      - name: List the data files of the platform sub-package
        run: |
          set -eux

          # Find the installed platform sub-package (there should be exactly
          # one matching the runner's os/cpu/libc).
          pkg_dir=$(ls -d install-test/node_modules/@wasp/cli-*/data 2>/dev/null | head -1)

          if [ -z "$pkg_dir" ]; then
            echo "::error::No platform sub-package with data directory found"
            exit 1
          fi

          # Strip the trailing /data to get the package root, then walk the
          # data directory and produce a tab-separated manifest of relative
          # paths and their SHA-256 hashes.
          pkg_root="${pkg_dir%/data}"
          (cd "$pkg_root" && find ./data -type f | while IFS= read -r file; do
            hash=$(sha256sum "$file" | cut -d' ' -f1)
            printf '%s\t%s\n' "$file" "$hash"
          done) > actual-data-files.txt

      - name: Verify the data files of the platform sub-package
        env:
          EXPECTED_DATA_FILES: ${{ inputs.data-files-list }}
        run: |
          set -eux

          echo "$EXPECTED_DATA_FILES" > expected-data-files.txt

          # Both lists are sorted before comparison so file discovery order
          # doesn't cause spurious failures.
          diff <(sort expected-data-files.txt) <(sort actual-data-files.txt)

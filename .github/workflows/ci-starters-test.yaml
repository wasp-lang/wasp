name: "Test - Starters"

on:
  workflow_call:

env:
  WASP_TELEMETRY_DISABLE: 1
  # All Playwright configs only use Chromium, and CI runs headless.
  WASP_PLAYWRIGHT_INSTALL_FLAGS: "--with-deps --only-shell chromium"

jobs:
  test-starters:
    name: Test starters
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-tools

      - uses: $/.github/actions/install-wasp-cli-artifact

      # The tests depend on the wasp-app-runner from this repo. The filter
      # installs it along with the tests, and the second command builds it.
      - name: Install node dependencies
        run: pnpm install --filter starters-e2e-tests... && pnpm --filter @wasp/wasp-app-runner run build

      - name: Run starters e2e tests
        working-directory: waspc/starters-e2e-tests
        env:
          WASP_APP_RUNNER_CLI_CMD: ${{ github.workspace }}/packages/wasp-app-runner/bin/index.js
        run: pnpm run test:dev

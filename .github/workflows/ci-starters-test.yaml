name: "Test - Starters"

on:
  workflow_call:

env:
  WASP_TELEMETRY_DISABLE: 1
  # All Playwright configs only use Chromium, and CI runs headless.
  WASP_PLAYWRIGHT_INSTALL_FLAGS: "--with-deps --only-shell chromium"

jobs:
  test-starters:
    name: Test starters (${{ matrix.package-manager }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package-manager:
          - npm
          - pnpm
          - bun
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-tools

      - uses: $/.github/actions/install-wasp-cli-artifact

      - uses: $/.github/actions/setup-dev-wasp-packages

      # `...` also installs the app runner the tests depend on.
      - name: Install node dependencies
        run: pnpm install --filter starters-e2e-tests... && pnpm --filter @wasp/wasp-app-runner run build

      # The other package managers come with the tools set up above.
      - name: Install Bun
        if: matrix.package-manager == 'bun'
        run: npm install --global bun

      - name: Run starters e2e tests
        working-directory: waspc/starters-e2e-tests
        env:
          WASP_APP_RUNNER_CLI_CMD: ${{ github.workspace }}/packages/wasp-app-runner/bin/index.js
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: pnpm run test:dev --package-manager "$PACKAGE_MANAGER"

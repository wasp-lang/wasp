name: "Release - Deploy examples"

on:
  # Allow calling this workflow from other workflows
  workflow_call:
    inputs:
      version:
        type: string
        description: "Wasp version to use for deployment (e.g., 0.18.0), defaults to latest"
        required: false
        default: "latest"
    secrets:
      FLY_GITHUB_PRODUCTION_TOKEN:
        description: "Fly API token for deploying apps"
        required: true
      RAILWAY_GITHUB_PRODUCTION_TOKEN:
        description: "Railway account token for deploying production apps"
        required: true

  # Allow calling this workflow manually from the GitHub UI
  workflow_dispatch:
    inputs:
      version:
        description: "Wasp version to use for deployment (e.g., 0.18.0), defaults to latest"
        required: false
        default: "latest"

concurrency:
  group: "release-examples-deploy"
  cancel-in-progress: true

env:
  WASP_TELEMETRY_DISABLE: 1

permissions:
  contents: read

jobs:
  deploy:
    strategy:
      matrix:
        app-dir:
          - examples/waspello
          - examples/waspleau
          - examples/websockets-realtime-voting
          - examples/ask-the-documents
          - examples/kitchen-sink

    name: Deploy ${{ matrix.app-dir }}

    runs-on: ubuntu-latest

    environment:
      name: ${{ matrix.app-dir }}-production
      url: ${{ steps.app-info.outputs.url }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-tools

      - name: Install Wasp
        env:
          WASP_VERSION: ${{ inputs.version }}
        run:
          # We deploy with the exact released Wasp version.
          # zizmor: ignore[adhoc-packages]
          |
          npm i -g "@wasp.sh/wasp-cli@${WASP_VERSION}"

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Install app dependencies
        working-directory: ${{ matrix.app-dir }}
        run: wasp install

      - name: Deploy
        working-directory: ${{ matrix.app-dir }}
        run: |
          wasp deploy fly deploy --org wasp
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_GITHUB_PRODUCTION_TOKEN }}

      - name: Get deployed app info
        id: app-info
        working-directory: ${{ matrix.app-dir }}
        run: |
          client_hostname=$(flyctl status -c fly-client.toml --json | jq -er .Hostname)
          server_hostname=$(flyctl status -c fly-server.toml --json | jq -er .Hostname)
          echo "url=https://${client_hostname}" >> "$GITHUB_OUTPUT"
          echo "server-url=https://${server_hostname}" >> "$GITHUB_OUTPUT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_GITHUB_PRODUCTION_TOKEN }}

      - name: Verify deployed app URLs
        uses: $/.github/actions/wait-for-deployed-app
        with:
          server-url: ${{ steps.app-info.outputs.server-url }}
          client-url: ${{ steps.app-info.outputs.url }}

  deploy-railway:
    name: Deploy ask-the-documents to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: examples/ask-the-documents-railway-production
      url: https://ask-the-documents-client.up.railway.app

    env:
      RAILWAY_PROJECT_ID: d5be4f30-4193-4c2e-9f0c-fa9444654693
      RAILWAY_ENVIRONMENT: production
      SERVER_URL: https://ask-the-documents-server.up.railway.app
      CLIENT_URL: https://ask-the-documents-client.up.railway.app

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-tools

      - name: Install Wasp
        env:
          WASP_VERSION: ${{ inputs.version }}
        run:
          # zizmor: ignore[adhoc-packages]
          npm i -g "@wasp.sh/wasp-cli@${WASP_VERSION}"

      - name: Install app dependencies
        working-directory: examples/ask-the-documents
        run: wasp install

      - name: Deploy to Railway
        working-directory: examples/ask-the-documents
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_GITHUB_PRODUCTION_TOKEN }}
        run: |
          wasp deploy railway deploy ask-the-documents \
            --existing-project-id "$RAILWAY_PROJECT_ID" \
            --custom-server-url "$SERVER_URL"

      - name: Verify Railway deployments
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_GITHUB_PRODUCTION_TOKEN }}
        run: |
          wait_for_deployment() {
            local service="$1"
            local deployments deployment_id status current_id
            deployments=$(railway deployment list --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$service" --limit 1 --json)
            deployment_id=$(jq -er '.[0].id' <<< "$deployments")

            for attempt in $(seq 1 60); do
              deployments=$(railway deployment list --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$service" --limit 1 --json)
              current_id=$(jq -er '.[0].id' <<< "$deployments")
              status=$(jq -er '.[0].status' <<< "$deployments")
              if [ "$current_id" != "$deployment_id" ]; then
                echo "$service deployment was superseded"
                return 1
              fi
              case "$status" in
                SUCCESS) return 0 ;;
                FAILED|CRASHED|REMOVED|SKIPPED)
                  echo "$service deployment $deployment_id ended with $status"
                  return 1
                  ;;
              esac
              echo "Attempt $attempt/60: $service deployment is $status"
              sleep 10
            done
            echo "Timed out waiting for $service deployment $deployment_id"
            return 1
          }
          wait_for_deployment ask-the-documents-server
          wait_for_deployment ask-the-documents-client

      - name: Verify deployed app URLs
        uses: $/.github/actions/wait-for-deployed-app
        with:
          server-url: ${{ env.SERVER_URL }}
          client-url: ${{ env.CLIENT_URL }}

name: "Test - waspc"

on:
  workflow_call:
  workflow_dispatch:

env:
  WASP_TELEMETRY_DISABLE: 1

defaults:
  run:
    shell: bash
    working-directory: waspc

permissions:
  contents: read

jobs:
  test:
    name: Test waspc (${{ matrix.os }}, ${{ matrix.node == 'latest' && 'node latest' || 'default' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is covered by the cross-compilation job in ci-waspc-build
        # (unit tests run under wine there); Nix doesn't run natively on
        # Windows, so there is no native Windows job anymore.
        os:
          # We are using a fixed Ubuntu version instead of 'ubuntu-latest' to
          # prevent the version from changing on its own.
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15 # Apple Silicon
        node:
          - latest

        # In addition to the default matrix, we also want to run the build job
        # for additional Node.js versions, to make sure that Wasp works with
        # them. To reduce the number of jobs, we only test the Node.js versions
        # on Ubuntu 22.04.
        include:
          - # No node override here, so we use the flake's default Node.js
            # version, which is equal to our lowest supported one.
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          dev-shell: ci

      - name: Install latest Node.js
        if: ${{ matrix.node == 'latest' }}
        uses: actions/setup-node@v6
        with:
          # setup-node prepends to the PATH, so this wins over the dev
          # shell's pinned Node.
          node-version: latest

      - name: Compile TS packages and libs
        run: |
          node tools/packages/build.ts
          node tools/libs/build.ts

      - name: Build external dependencies
        run: cabal build --enable-tests --enable-benchmarks --only-dependencies

      - name: Build wasp code
        run: cabal build all

      - name: Run unit tests
        run: cabal test wasp-cli-tests waspc-tests

      - name: Run `waspc` e2e tests
        env:
          WASP_E2E_TESTS_SKIP_DOCKER: ${{ runner.os == 'macOS' && '1' || '' }}
        run: cabal test waspc-e2e-tests --test-options='--hide-successes'

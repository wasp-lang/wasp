name: "Test - TS Spec"

on:
  workflow_call:

env:
  WASP_TELEMETRY_DISABLE: 1

jobs:
  test-wasp-spec:
    name: Test @wasp.sh/spec
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools

      # The packages are npm workspaces of `waspc/`, so the install has to
      # happen at the workspace root.
      - name: Install @wasp.sh/spec dependencies
        working-directory: waspc
        run: npm ci

      - name: Run @wasp.sh/spec tests
        working-directory: waspc/packages/spec
        run: npm run test

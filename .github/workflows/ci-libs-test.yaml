name: "Test - Wasp Libs"

on:
  workflow_call:

env:
  WASP_TELEMETRY_DISABLE: 1

jobs:
  test-libs:
    name: Test Wasp libs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          dev-shell: ci-no-haskell

      - name: Test all libs
        working-directory: waspc
        run: node tools/libs/test.ts

name: "Check - Web"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-web-markdown:
    name: Build web and check markdown snapshots
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Docusaurus resolves `showLastUpdateTime` dates from git history,
          # and those dates end up in the generated blog post markdown.
          # With the default shallow clone every file appears last-updated at
          # the current merge commit, so the markdown snapshots never match.
          fetch-depth: 0

      - uses: $/.github/actions/setup-tools
        with:
          # We only need Node here, so we skip the Haskell tools.
          haskell: false

      - name: Install web dependencies
        run: pnpm install --filter web...

      - name: Build website
        working-directory: web
        # Unlike the production deploy, this build includes the "current"
        # (next, unreleased) docs version. The markdown snapshots track it so
        # docs drift shows up in the PR that causes it, not at release time.
        run: pnpm run build-dev

      - name: Check markdown snapshots
        working-directory: web
        run: pnpm run markdown-snapshots:check

  build-web-production:
    name: Build web for production
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-tools
        with:
          haskell: false

      - name: Install web dependencies
        run: pnpm install --filter web...

      - name: Build website
        working-directory: web
        # This is the same build the production deploy runs. It excludes the
        # "current" docs version, which moves the latest released version to
        # the unprefixed `/docs` path. The job above can't catch problems that
        # only show up in that layout, e.g. a link to `/docs/<latest-version>/`,
        # so without this job they would only fail the deploy after merging.
        run: pnpm run build

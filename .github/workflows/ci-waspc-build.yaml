name: "Build - Wasp CLI binaries"

# We never trigger this workflow directly.
# We can call it manually (workflow_dispatch) or from other workflows (workflow_call).
on:
  workflow_call:
    outputs:
      waspc_version:
        value: ${{ jobs.build.outputs.waspc_version }}
        description: "The Wasp version built in this workflow."
      data_files_list:
        value: ${{ jobs.build.outputs.data_files_list }}
        description: "List of data files with per-file SHA-256 hashes."
      output_linux-x86_64:
        value: ${{ jobs.build.outputs.output_linux-x86_64 }}
        description: "The build output metadata for linux-x86_64."
      output_linux-x86_64-static:
        value: ${{ jobs.build.outputs.output_linux-x86_64-static }}
        description: "The build output metadata for linux-x86_64-static."
      output_linux-aarch64:
        value: ${{ jobs.build.outputs.output_linux-aarch64 }}
        description: "The build output metadata for linux-aarch64."
      output_macos-x86_64:
        value: ${{ jobs.build.outputs.output_macos-x86_64 }}
        description: "The build output metadata for macos-x86_64."
      output_macos-aarch64:
        value: ${{ jobs.build.outputs.output_macos-aarch64 }}
        description: "The build output metadata for macos-aarch64."

env:
  WASP_TELEMETRY_DISABLE: 1

jobs:
  build:
    outputs:
      waspc_version: ${{ steps.set-outputs.outputs.waspc_version }}
      data_files_list: ${{ steps.data-files.outputs.list }}
      output_linux-x86_64: ${{ steps.set-outputs.outputs.output_linux-x86_64 }}
      output_linux-x86_64-static: ${{ steps.set-outputs.outputs.output_linux-x86_64-static }}
      output_linux-aarch64: ${{ steps.set-outputs.outputs.output_linux-aarch64 }}
      output_macos-x86_64: ${{ steps.set-outputs.outputs.output_macos-x86_64 }}
      output_macos-aarch64: ${{ steps.set-outputs.outputs.output_macos-aarch64 }}

    strategy:
      fail-fast: false

      matrix:
        # All artifacts are built with `nix build` from the flake's release
        # derivations, on plain runners — the old per-platform containers
        # (ubuntu:20.04 for a low glibc floor, alpine for musl) are gone:
        #
        # - The Linux binaries are fully-static musl builds now, so they run
        #   on any distro regardless of its libc — which is also why the
        #   `linux-x86_64` and `linux-x86_64-static` artifacts are the same
        #   file published under both names (kept for compatibility with the
        #   npm package layout and download URLs).
        # - The macOS binaries are dynamic (macOS syscalls are private, no
        #   static linking) but post-processed to bundle their few non-system
        #   dylibs, so they don't depend on /nix on the user's machine.
        env:
          - name: linux-x86_64
            runner: ubuntu-latest
            tarball-package: release-tarball-linux-x86_64
            also-upload-as: linux-x86_64-static

          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            tarball-package: release-tarball-linux-aarch64

          - name: macos-x86_64
            runner: macos-15-intel
            tarball-package: release-tarball-macos-x86_64

          - name: macos-aarch64
            runner: macos-15 # By default an Apple Silicon-based runner.
            tarball-package: release-tarball-macos-aarch64

    runs-on: ${{ matrix.env.runner }}
    name: Build Wasp (${{ matrix.env.name }})

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix

      - name: Compute artifact names
        uses: ./.github/actions/compute-artifact-names
        id: compute-artifact-names
        with:
          build-name: ${{ matrix.env.name }}

      - name: Compute extra artifact names
        if: ${{ matrix.env.also-upload-as }}
        uses: ./.github/actions/compute-artifact-names
        id: compute-extra-artifact-names
        with:
          build-name: ${{ matrix.env.also-upload-as }}

      - name: Build and package
        env:
          TARBALL_PACKAGE: ${{ matrix.env.tarball-package }}
          TARBALL_NAME: ${{ steps.compute-artifact-names.outputs.tarball-name }}
        run: |
          nix build -L ".#${TARBALL_PACKAGE}"
          mkdir -p waspc/artifacts
          cp -L result "waspc/artifacts/${TARBALL_NAME}"

      - name: Package extra artifact
        if: ${{ matrix.env.also-upload-as }}
        env:
          EXTRA_TARBALL_NAME: ${{ steps.compute-extra-artifact-names.outputs.tarball-name }}
        run: cp -L result "waspc/artifacts/${EXTRA_TARBALL_NAME}"

      - name: Compute data files list
        # The data dir contents are identical across platforms (and
        # ci-npm-package-test verifies that), so one platform producing the
        # list is enough.
        if: ${{ matrix.env.name == 'linux-x86_64' }}
        id: data-files
        run: |
          nix build .#wasp-data-manifest --out-link data-manifest
          {
            echo 'list<<EOF'
            cat data-manifest
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          path: ./waspc/artifacts/${{ steps.compute-artifact-names.outputs.tarball-name }}
          name: ${{ steps.compute-artifact-names.outputs.artifact-name }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: ${{ matrix.env.also-upload-as }}
        with:
          path: ./waspc/artifacts/${{ steps.compute-extra-artifact-names.outputs.tarball-name }}
          name: ${{ steps.compute-extra-artifact-names.outputs.artifact-name }}
          if-no-files-found: error

      - name: Set job outputs
        id: set-outputs
        env:
          OUTPUT_DATA: ${{ toJson(steps.compute-artifact-names.outputs) }}
          EXTRA_OUTPUT_DATA: ${{ toJson(steps.compute-extra-artifact-names.outputs) }}
          EXTRA_NAME: ${{ matrix.env.also-upload-as }}
        run: |
          {
            echo 'output_${{ matrix.env.name }}<<EOF'
            echo "$OUTPUT_DATA"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
          if [ -n "$EXTRA_NAME" ]; then
            {
              echo "output_${EXTRA_NAME}<<EOF"
              echo "$EXTRA_OUTPUT_DATA"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          fi
          echo "waspc_version=$(nix run .#get-waspc-version)" >> $GITHUB_OUTPUT

  # Windows coverage: the CLI is cross-compiled from Linux (mingw-w64), with
  # Template Haskell running under wine, and the unit test suites are run
  # under wine as a smoke check. This replaced the native windows-latest job;
  # the e2e tests can't run under wine (they spawn real node/npm/git), so
  # Windows e2e coverage is gone — revisit if Windows regressions appear.
  # Windows binaries are not released; the zip is a CI artifact only.
  build-windows:
    name: Build Wasp (windows-x86_64, cross-compiled)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix

      - name: Cross-compile for Windows
        run: nix build -L .#release-zip-windows-x86_64

      - uses: actions/upload-artifact@v7
        with:
          path: result
          name: wasp-cli-windows-x86_64
          if-no-files-found: error

      - name: Run unit tests under wine
        # Wine-based Template Haskell/iserv is the least battle-tested part
        # of the cross-compilation setup, so a failure here doesn't fail CI
        # while we build confidence in it.
        continue-on-error: true
        run: nix build -L .#checks.x86_64-linux.windows-unit-tests

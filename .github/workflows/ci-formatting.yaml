name: "Check - Formatting"

on:
  workflow_call:

env:
  WASP_TELEMETRY_DISABLE: 1

permissions:
  contents: read

# Each formatting check is a pure Nix build over the tracked sources — no
# dev shell or working-tree setup needed.
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix

      - name: Run Prettier
        run: nix build -L .#checks.x86_64-linux.prettier

  ormolu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix

      - name: Run ormolu
        run: nix build -L .#checks.x86_64-linux.ormolu

  cabal-gild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix

      - name: Run cabal-gild
        run: nix build -L .#checks.x86_64-linux.cabal-gild

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix

      - name: Check version pins are consistent across the repo
        run: nix build -L .#checks.x86_64-linux.versions-consistent

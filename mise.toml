# Keep in sync with .github/actions/setup-tools/action.yaml
min_version = "2026.11.5"

# See the `[monorepo]` section below.
monorepo_root = true

[tools]
ghcup = "0.2.6.2"

"mise-ghcup:cabal" = "recommended"

# Holding off GHC 9.10 since HLint doesn't work with it:
# https://github.com/haskell/haskell-language-server/issues/4674
"mise-ghcup:ghc" = "recommended"

# When upgrading the HLS version, we need to ensure compatibility with our GHC
# version. You can see the compatibility table at:
# https://haskell-language-server.readthedocs.io/en/latest/support/ghc-version-support.html
# Check that the HLS version has a prebuilt binary for the GHC version we are
# using by running the following command:
# `type haskell-language-server-$(ghc --numeric-version)`
"mise-ghcup:hls" = "recommended"

# Use the same versions of HLint and Stan as the ones used inside the HLS binary
# above. You can run the following command to find the plugin versions in the
# current GHC+HLS combination:
# `haskell-language-server-$(ghc --numeric-version) --list-plugins`
"mise-cabal:hlint" = "3.8"
"mise-cabal:stan" = "0.2.1.0"

jq = "latest"
railway = "5.64.2"

"github:tfausak/cabal-gild" = "latest"

# TODO: Provide a fallback for Linux ARM64
# The upstream repo only distributes prebuilt binaries for Linux x64, macOS
# (all, and Windows x64.
# https://github.com/jdx/mise/discussions/10828
ormolu.version = "latest"
ormolu.os = ["linux/x64", "darwin", "windows/x64"]

[plugins]
"vfox-backend:mise-ghcup" = "packslip:wasp-lang/mise-ghcup#3.0.0"
"vfox-backend:mise-cabal" = "packslip:wasp-lang/mise-cabal#2.0.0"

[bootstrap.packages]
# Dependencies for Ubuntu / Debian
# GHCup dependencies (https://www.haskell.org/ghcup/install/reqs/#linux-ubuntu)
"apt:build-essential" = "latest"
"apt:curl" = "latest"
"apt:libffi-dev" = "latest"
"apt:libgmp-dev" = "latest"
"apt:libncurses-dev" = "latest"
# Cabal dependencies
"apt:zlib1g-dev" = "latest"
# Node.js dependencies (https://github.com/nodejs/node/blob/main/BUILDING.md#official-binary-platforms-and-toolchains)
"apt:libatomic1" = "latest"

# Dependencies for Alpine
# GHCup dependencies (https://www.haskell.org/ghcup/install/reqs/#linux-alpine)
"apk:binutils-gold" = "latest"
"apk:curl" = "latest"
"apk:gcc" = "latest"
"apk:g++" = "latest"
"apk:gmp-dev" = "latest"
"apk:gmp-static" = "latest"
"apk:libc-dev" = "latest"
"apk:libffi-dev" = "latest"
"apk:make" = "latest"
"apk:musl-dev" = "latest"
"apk:ncurses-dev" = "latest"
"apk:perl" = "latest"
"apk:pkgconfig" = "latest"
"apk:tar" = "latest"
"apk:xz" = "latest"
# Task dependencies
"apk:bash" = "latest"
# Cabal dependencies
"apk:zlib-dev" = "latest"
"apk:zlib-static" = "latest"
# Prisma dependencies
"apk:openssl" = "latest"

[settings]
lockfile = true
experimental = true # Needed for backend plugins (mise-ghcup and mise-cabal) to work.

# The Node version is read from /.node-version, and the pnpm version from
# `devEngines` in /package.json.
idiomatic_version_file_enable_tools = ["node", "pnpm"]

[settings.node]
# The Node backend has a knack for compiling from source on Alpine even when
# there's a pre-built binary available. So we explicitly tell it not to do that.
compile = false

[vars]
# `{{config_root}}` in a task's `env` resolves to the task file's directory,
# so the tasks use these absolute paths instead.
repo_dir = "{{config_root}}"
waspc_dir = "{{config_root}}/waspc"
wasp_cli_dev = "{{config_root}}/waspc/tools/wasp-cli-dev"
wasp_app_runner_cli = "{{config_root}}/packages/wasp-app-runner/bin/index.js"

# Installs the workspace dependencies before `mise run` and `mise exec` when
# they are out of date.
[deps.pnpm]
auto = true

# Repo-wide tasks, run from anywhere as `mise run //:<task>` (or `mise run
# <task>` from the repo root).
[task_config]
includes = ["tasks"]
excludes = ["tasks/node_modules"]

# Each project's tasks live in its own `mise.toml`, and run from anywhere as
# `mise run //<path>:<task>` (e.g. `mise run //waspc:build`), or as `mise run
# <task>` from inside the project. Note that a bare task name always refers to
# the current directory's project, so tasks from elsewhere need the full path.
# https://mise.jdx.dev/tasks/monorepo.html
[monorepo]
config_roots = [
  "waspc",
  "waspc/starters-e2e-tests",
  "packages/*",
  "packages/libs/*",
  "examples/*",
  "examples/tutorials/*",
]

# Project graph, used by `^build` dependencies and `mise run --affected`. mise
# reads the TS projects and their dependencies from `pnpm-workspace.yaml` and
# their `package.json` files, so only the rest is declared here. Inspect it
# with `mise tasks graph`.
# https://mise.jdx.dev/tasks/workspace-graph.html
[monorepo.projects."wasp:waspc"]
root = "waspc"
# The libs and packages that waspc ships in its data dir.
depends = [
  "node:@wasp/lib-auth",
  "node:@wasp/lib-sdk-core",
  "node:@wasp/lib-test-utils",
  "node:@wasp/lib-vite-ssr",
  "node:@wasp/spec",
  "node:@wasp/deploy",
  "node:@wasp/studio",
]

# Task templates the projects' tasks extend.
# https://mise.jdx.dev/tasks/templates.html
#
# The `build` tasks declare their `sources` and `outputs`, so mise skips them
# while they're up to date. Pass `--force` to `mise run` to rebuild anyway.
# https://mise.jdx.dev/tasks/caching.html
#
# The lib and package ones run on Windows CI too, where mise runs tasks with
# `cmd`, so they must stick to commands that work in both `sh` and `cmd`.

[task_templates."wasp:lib:build"]
description = "Builds the lib and packs it into waspc/data/Generator/libs/."
depends = ["^build"]
sources = [
  "src/**",
  "package.json",
  "README.md",
  "tsconfig.json",
  "tsdown.config.ts",
  "{{vars.repo_dir}}/pnpm-lock.yaml",
]
outputs = ["{{vars.waspc_dir}}/data/Generator/libs/{{config_root | basename}}/*.tgz"]
run = 'node "{{vars.waspc_dir}}/tools/libs/build.ts"'

[task_templates."wasp:lib:test"]
description = "Tests the lib."
# Its own `dist/`, and its dependencies' through `^build`.
depends = ["build"]
run = "pnpm run test"

[task_templates."wasp:package:build"]
description = "Builds the package and copies it into waspc/data/packages/."
depends = ["^build"]
sources = [
  "src/**",
  "package.json",
  "tsconfig.json",
  "{{vars.repo_dir}}/pnpm-lock.yaml",
]
outputs = ["{{vars.waspc_dir}}/data/packages/{{config_root | basename}}/dist/**"]
run = 'node "{{vars.waspc_dir}}/tools/packages/build.ts"'

[task_templates."wasp:example:test"]
description = "Runs the example's e2e tests with the local Wasp CLI."
depends = ["//waspc:build", "//packages/wasp-app-runner:build"]
env.WASP_CLI_CMD = "{{vars.wasp_cli_dev}}"
env.WASP_APP_RUNNER_CLI_CMD = "{{vars.wasp_app_runner_cli}}"
run = [
  "[ ! -f .env.server.example ] || [ -f .env.server ] || cp .env.server.example .env.server",
  '"$WASP_CLI_CMD" install',
  "npm run test",
]

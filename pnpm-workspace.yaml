# `packageManager` in package.json is for Cloudflare Pages, which builds web/.
#
# Still on npm:
# - examples/ and the e2e test apps: Wasp apps require npm.
packages:
  - packages/cli
  - packages/deploy
  - packages/spec
  - packages/studio
  - packages/studio/client
  - packages/libs/*
  - packages/wasp-app-runner
  - web
  - web/tutorial-actions-executor
  - scripts/make-npm-packages
  - waspc/starters-e2e-tests
  - waspc/tools
  - tasks

# `pnpm pack` replaces `catalog:` with the real version in published packages.
catalog:
  typescript: &typescript 6.0.3
  "@types/node": ^24.0.1
  vitest: ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  tsx: ^4.20.6
  zx: ^8.8.5
  commander: ^14.0.2
  execa: ^9.6.1
  "@commander-js/extra-typings": ^14.0.0
  prettier: 3.5.3
  semver: ^7.7.3
  "@types/semver": ^7.7.1

# Source of truth for the npm dependency versions of generated Wasp apps. waspc
# reads them at compile time (see `Wasp.Generator.DepVersions.Catalog`).
# Use `catalog:generated-app` for any version in this repo that must stay in sync
# with the generated app's dependencies.
catalogs:
  generated-app:
    # Also ensure `waspc/data/Generator/templates/sdk/wasp/prisma-runtime-library.d.ts` is up to date.
    prisma: 6.19.3
    superjson: ^2.2.1
    typescript: *typescript
    # The major version of Wasp's lowest supported Node version. waspc computes
    # the generated app's version from it (`Wasp.Node.Version`), and a unit test
    # checks that it matches this one.
    "@types/node": ^24.0.0
    # `react` and `react-dom` versions should always match.
    react: ^19.2.1
    react-dom: ^19.2.1
    # Follows React major version.
    "@types/react": ^19.2.7
    "@types/react-dom": ^19.2.3
    react-router: ^8.0.1
    "@tanstack/react-query": ~4.42.0
    react-hook-form: ^7.45.4
    express: ~5.1.0
    "@types/express": ^5.0.0
    vite: ^8.1.0
    "@vitejs/plugin-react": ^6.0.3
    dotenv: ^16.6.1
    ky: ^2.0.0
    zod: ^4.3.6
    cookie-parser: ~1.4.6
    cors: ^2.8.5
    "@types/cors": ^2.8.5
    morgan: ~1.12.1
    helmet: ^6.0.0
    rollup: ^4.9.6
    rollup-plugin-esbuild: ^6.1.1
    "@rollup/plugin-node-resolve": ^16.0.0
    nf3: 0.4.2
    lucia: ^3.0.1
    arctic: ^1.2.1
    socket.io: ^4.6.1
    "@socket.io/component-emitter": ^4.0.0
    # Our pg-boss related documentation references this version in URLs.
    # Please update the docs when this changes (until we solve:
    # https://github.com/wasp-lang/wasp/issues/596).
    pg-boss: ^8.4.2
    nodemailer: ^8.0.1
    "@types/nodemailer": ^8.0.0
    "@sendgrid/mail": ^7.7.0
    mailgun.js: ^10.2.3
    resend: ^6.0.0

# Same as `min-release-age=7` in .npmrc, in minutes.
minimumReleaseAge: 10080

# Install scripts we do not need: messages, or binaries that are optional
# dependencies anyway. @heroui/shared-utils only swaps in a Next.js build when
# Next.js is installed.
allowBuilds:
  "@heroui/shared-utils": false
  "@swc/core": false
  core-js: false
  esbuild: false
  fsevents: false
  msw: false

# Third-party packages cannot resolve undeclared (phantom) dependencies
# through `node_modules/.pnpm/node_modules`.
hoist: false

# typedoc resolves its plugins from its own location.
packageExtensions:
  typedoc:
    dependencies:
      typedoc-plugin-markdown: "*"
      typedoc-docusaurus-theme: "*"

# Dev convenience only, a failed install here just warns. Scripts and CI
# install explicitly.
verifyDepsBeforeRun: install

catalogMode: prefer

dedupePeers: true

# `A=1 cmd` and `${VAR:-default}` in scripts work on Windows.
shellEmulator: true

# Supply chain. A version published with less trust evidence than an earlier
# version of the same package (a token publish after trusted publishing) is
# rejected, and only our own direct dependencies may come from git or a URL
# (the default, written down).
# Refuses an unsupported Node (`engines` in package.json). The pnpm version is
# enforced through `packageManager`.
engineStrict: true

trustPolicy: no-downgrade
blockExoticSubdeps: true
# Published before their packages adopted trusted publishing. Pruned
# automatically.
trustPolicyExclude:
  - hosted-git-info@6.1.3
  - semver@6.3.1
  - tailwind-merge@2.6.1
  - webpack-dev-middleware@7.4.6
trustPolicyExcludePrune: true

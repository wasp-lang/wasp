# The Wasp repo is a pnpm workspace, but a few projects in it still use npm.
# pnpm is pinned in mise.toml for us and in package.json's `packageManager`
# for Cloudflare Pages, which builds web/ with it.
#
# Not members yet:
# - packages/deploy, packages/prisma, packages/studio. waspc ships them with
#   their own package-lock.json and installs them with npm on first use.
#   TODO: Move them in once they are part of the Wasp npm package.
# - examples/ and the e2e test projects. They are Wasp apps, which use npm.
#   TODO: Move them in once Wasp apps support pnpm.
packages:
  - packages/spec
  - packages/libs/*
  - packages/wasp-app-runner
  - web
  - web/tutorial-actions-executor
  - scripts/make-npm-packages
  - waspc/starters-e2e-tests
  - waspc/tools

# The tools every package uses, pinned once. A package says `catalog:` for
# them, so their versions cannot drift between packages, and `pnpm pack`
# writes the real version into what we publish.
catalog:
  typescript: ~6.0.3
  "@types/node": ^24.0.1
  vitest: ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  tsx: ^4.20.6
  zx: ^8.8.5
  commander: ^14.0.2
  "@commander-js/extra-typings": ^14.0.0
  prettier: 3.5.3

# Same as `min-release-age=7` in .npmrc, in minutes.
minimumReleaseAge: 10080

# None of these install scripts matter here. msw prints a support message,
# esbuild and @swc/core look for a binary that is an optional dependency anyway,
# core-js prints a funding message, fsevents ships prebuilt.
allowBuilds:
  "@swc/core": false
  core-js: false
  esbuild: false
  fsevents: false
  msw: false

# No phantom dependencies. pnpm keeps our own packages strict by default, but
# it also links every package into `node_modules/.pnpm/node_modules`, which
# every third-party package can resolve from. A dependency that imports
# something it never declared keeps working through that directory, and so
# does a stale resolution. Without it, both fail at build time.
hoist: false

# typedoc loads its plugins by name from its own location, so they have to be
# dependencies of typedoc itself for it to find them without hoisting.
packageExtensions:
  typedoc:
    dependencies:
      typedoc-plugin-markdown: "*"
      typedoc-docusaurus-theme: "*"

# Before `pnpm run` and `pnpm exec`, install whatever node_modules is missing
# compared to the lockfile and the manifests. A convenience for day-to-day
# work, since a failed install here only warns. The build scripts and CI keep
# their explicit `pnpm install`, which fails loudly.
verifyDepsBeforeRun: install

# `pnpm add` records the version in the catalog above when the package is in it.
catalogMode: prefer

# One copy of a package per version where the peers allow it, instead of one
# copy per distinct set of peers.
dedupePeers: true

# Scripts run in a shell emulator, so `A=1 cmd` and `${VAR:-default}` work the
# same on Windows.
shellEmulator: true

# Supply chain. A version published with less trust evidence than an earlier
# version of the same package (a token publish after trusted publishing) is
# rejected, and only our own direct dependencies may come from git or a URL
# (the default, written down).
trustPolicy: no-downgrade
blockExoticSubdeps: true
# Versions published before their package adopted trusted publishing, which
# the policy reads as a downgrade. Reviewed by hand; pnpm drops an entry from
# this list once nothing depends on it anymore.
trustPolicyExclude:
  - hosted-git-info@6.1.3
  - semver@6.3.1
  - tailwind-merge@2.6.1
  - webpack-dev-middleware@7.4.6
trustPolicyExcludePrune: true

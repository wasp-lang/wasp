# `packageManager` in package.json is for Cloudflare Pages, which builds web/.
#
# Not in the workspace:
# - the e2e test apps, which test Wasp projects outside of a workspace.
packages:
  - packages/auth
  - packages/cli
  - packages/deploy
  - packages/sdk-core
  - packages/spec
  - packages/studio
  - packages/studio/client
  - packages/test-utils
  - packages/vite-ssr
  - packages/wasp
  - packages/wasp-app-runner
  - web
  - web/sdk-api-docs
  - web/tutorial-actions-executor
  - packages/cli/scripts/make-cli-npm-packages
  - waspc/starters-e2e-tests
  - waspc/tools
  - tasks
  - examples/*
  - examples/tutorials/*

# `pnpm pack` replaces `catalog:` with the real version in published packages.
catalog:
  typescript: ~6.0.3
  "@types/node": ^26.0.0
  vitest: ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  zx: ^8.8.5
  commander: ^14.0.2
  execa: ^9.6.1
  "@commander-js/extra-typings": ^14.0.0
  prettier: 3.5.3
  semver: ^7.7.3
  "@types/semver": ^7.7.1

# Same as `min-release-age=7` in .npmrc, in minutes.
minimumReleaseAge: 10080
# Wasp publishes its own packages with each release. The example apps install
# a new release on the day it comes out, to deploy it.
minimumReleaseAgeExclude:
  - "@wasp/*"

# The example apps get the packages of this repo as copies, like a project
# that installs them from npm, with the peer dependencies resolved from the
# app. Linked, a package would resolve its peers (Vite, React) from its own
# dev dependencies, a second copy next to the app's.
# `pnpm install` refreshes the copies, so it has to run after the packages are
# built (see the `build` task).
injectWorkspacePackages: true

# Install scripts we do not need: messages, or binaries that are optional
# dependencies anyway. The example apps run Prisma, which needs its engines.
allowBuilds:
  "@heroui/shared-utils": false
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": false
  core-js: false
  esbuild: false
  fsevents: false
  msw: false
  prisma: true

# Third-party packages cannot resolve undeclared (phantom) dependencies
# through `node_modules/.pnpm/node_modules`.
hoist: false

packageExtensions:
  # typedoc resolves its plugins from its own location.
  typedoc:
    dependencies:
      typedoc-plugin-markdown: "*"
      typedoc-docusaurus-theme: "*"
      typedoc-plugin-missing-exports: "*"
  # Its types import React's types without listing them. An example app uses
  # it, and with `hoist: false` it only finds what it lists.
  flowbite-react:
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true

# Dev convenience only, a failed install here just warns. Scripts and CI
# install explicitly.
verifyDepsBeforeRun: install

catalogMode: prefer

dedupePeers: true

# `A=1 cmd` and `${VAR:-default}` in scripts work on Windows.
shellEmulator: true

# Supply chain. A version published with less trust evidence than an earlier
# version of the same package (a token publish after trusted publishing) is
# rejected, and only our own direct dependencies may come from git or a URL
# (the default, written down).
# Refuses an unsupported Node (`engines` in package.json). The pnpm version is
# enforced through `packageManager`.
engineStrict: true

trustPolicy: no-downgrade
blockExoticSubdeps: true
# Published before their packages adopted trusted publishing. Pruned
# automatically.
trustPolicyExclude:
  # Published without provenance after 4.0.1 had it. prisma 6 pins it, and the
  # repo installs prisma as a peer of @wasp/wasp.
  - chokidar@4.0.3
  - hosted-git-info@6.1.3
  - semver@6.3.1
  - tailwind-merge@2.6.1
  - webpack-dev-middleware@7.4.6
trustPolicyExcludePrune: true

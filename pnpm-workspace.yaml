# `packageManager` in package.json is for Cloudflare Pages, which builds web/.
#
# Still on npm:
# - packages/deploy, packages/prisma, packages/studio: waspc installs them with
#   their own package-lock.json. TODO: Move them in once they are part of the
#   Wasp npm package.
# - examples/ and the e2e test apps: Wasp apps require npm.
packages:
  - packages/spec
  - packages/libs/*
  - packages/wasp-app-runner
  - web
  - web/tutorial-actions-executor
  - scripts/make-npm-packages
  - waspc/starters-e2e-tests
  - waspc/tools

# `pnpm pack` replaces `catalog:` with the real version in published packages.
catalog:
  typescript: ~6.0.3
  "@types/node": ^24.0.1
  vitest: ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  tsx: ^4.20.6
  zx: ^8.8.5
  commander: ^14.0.2
  "@commander-js/extra-typings": ^14.0.0
  prettier: 3.5.3

# Same as `min-release-age=7` in .npmrc, in minutes.
minimumReleaseAge: 10080

# Install scripts we do not need: messages, or binaries that are optional
# dependencies anyway.
allowBuilds:
  "@swc/core": false
  core-js: false
  esbuild: false
  fsevents: false
  msw: false

# Third-party packages cannot resolve undeclared (phantom) dependencies
# through `node_modules/.pnpm/node_modules`.
hoist: false

# typedoc resolves its plugins from its own location.
packageExtensions:
  typedoc:
    dependencies:
      typedoc-plugin-markdown: "*"
      typedoc-docusaurus-theme: "*"

# Dev convenience only, a failed install here just warns. Scripts and CI
# install explicitly.
verifyDepsBeforeRun: install

catalogMode: prefer

dedupePeers: true

# `A=1 cmd` and `${VAR:-default}` in scripts work on Windows.
shellEmulator: true

# Supply chain. A version published with less trust evidence than an earlier
# version of the same package (a token publish after trusted publishing) is
# rejected, and only our own direct dependencies may come from git or a URL
# (the default, written down).
# Refuses an unsupported Node (`engines` in package.json). The pnpm version is
# enforced through `packageManager`.
engineStrict: true

trustPolicy: no-downgrade
blockExoticSubdeps: true
# Published before their packages adopted trusted publishing. Pruned
# automatically.
trustPolicyExclude:
  - hosted-git-info@6.1.3
  - semver@6.3.1
  - tailwind-merge@2.6.1
  - webpack-dev-middleware@7.4.6
trustPolicyExcludePrune: true

# The Wasp repo is a pnpm workspace, but a few projects in it still use npm.
# pnpm is pinned in mise.toml and not in package.json's `packageManager`,
# because Cloudflare Pages would then build web/ (an npm project) with pnpm.
#
# Not members yet:
# - packages/deploy, packages/prisma, packages/studio. waspc ships them with
#   their own package-lock.json and installs them with npm on first use.
#   TODO: Move them in once they are part of the Wasp npm package.
# - web/. Deployed with npm on Cloudflare Pages.
#   TODO: Move it in and switch the Cloudflare build to pnpm.
# - examples/ and the e2e test projects. They are Wasp apps, which use npm.
#   TODO: Move them in once Wasp apps support pnpm.
packages:
  - packages/spec
  - packages/libs/*
  - packages/wasp-app-runner
  - scripts/make-npm-packages
  - waspc/tools

# Same as `min-release-age=7` in .npmrc, in minutes.
minimumReleaseAge: 10080

# msw only prints a support message in its postinstall script.
allowBuilds:
  msw: false
